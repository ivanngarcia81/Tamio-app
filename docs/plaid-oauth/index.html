<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex" />
<title>Volver a Tamio</title>
<style>
  :root { color-scheme: light dark; }
  body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
         line-height: 1.6; color: #1c1c1e; background: #f5f5f7; }
  .wrap { max-width: 520px; margin: 0 auto; padding: 64px 22px; text-align: center; }
  .card { background: #fff; border-radius: 16px; padding: 36px 28px;
          box-shadow: 0 1px 3px rgba(0,0,0,.06), 0 8px 30px rgba(0,0,0,.04); }
  h1 { font-size: 22px; margin: 0 0 10px; }
  p { font-size: 15.5px; color: #3a3a3c; margin: 8px 0; }
  .en { color: #8a8a8e; font-size: 14.5px; margin-top: 22px; }
  @media (prefers-color-scheme: dark) {
    body { background: #000; color: #f2f2f7; }
    .card { background: #1c1c1e; box-shadow: none; border: 1px solid #2c2c2e; }
    p { color: #d1d1d6; }
    .en { color: #98989d; }
  }
</style>
</head>
<body>
<!-- Dirección de regreso de OAuth de Plaid (redirect_uri) para la app del
     iPhone y el iPad. Con la app instalada, iOS abre Tamio en vez de esta
     página (enlace universal: ver `.well-known/apple-app-site-association`)
     y Plaid termina la conexión dentro de la app. Esta página solo se ve si
     se abre en un navegador sin la app. -->
<div class="wrap"><div class="card">
  <h1>Vuelve a Tamio</h1>
  <p>Ya terminaste en la página de tu banco. Abre la app de Tamio para acabar de conectar la cuenta.</p>
  <p class="en">You're done at your bank's page. Open the Tamio app to finish connecting the account.</p>
</div></div>
</body>
</html>
