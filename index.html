<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <!-- interactive-widget=resizes-content: al abrir el teclado, iOS encoge el
         viewport en vez de empujar la página, así 100dvh sigue siendo la
         altura visible y el pie de los modales queda pegado abajo. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no, interactive-widget=resizes-content" />
    <title>Tamio</title>
    <!-- OJO: este script va en línea a propósito (fija el tema ANTES del primer
         pintado, si no hay un destello blanco al abrir en modo oscuro), y el CSP
         de src-tauri/tauri.conf.json lo permite por el HASH de su contenido.
         Si tocas una sola letra de aquí abajo, hay que recalcular el hash:
           script-src ... 'sha256-XQF2Ra/0iGM20hPQywqbt5rB6jLh3/2gdLD2wpituPU='
         Si no, el navegador lo bloquea en silencio y vuelve el destello. -->
    <script>(function(){try{var t=localStorage.getItem("tesoreria-theme")||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");document.documentElement.setAttribute("data-theme",t);}catch(e){}})();</script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
