[package]
name = "tesoreria"
version = "1.2.0"
description = "Tamio — tesorería para iglesias"
authors = ["Tamio"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tesoreria_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Motor de base de datos cifrada (SQLCipher). Reemplaza a tauri-plugin-sql:
# sqlx no soporta SQLCipher, así que select/execute viven en src/motordb.rs.
rusqlite = { version = "0.32", features = ["bundled-sqlcipher-vendored-openssl"] }
# Clave del cifrado en el Llavero de macOS.
keyring = { version = "3", features = ["apple-native"] }
tauri-plugin-dialog = "2.7.1"
tauri-plugin-fs = "2.5.1"
# Solo para consultar el espacio libre antes de extraer un respaldo (statvfs).
# La biblioteca estándar de Rust no expone eso.
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
window-vibrancy = "0.5"

